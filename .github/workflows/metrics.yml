name: Generate Profile Metrics

on:
  schedule:
    - cron: "0 */8 * * *"     # three times a day
  workflow_dispatch:           # manual run button
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # ── 1 · Overview card (replaces github-readme-stats) ──
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: rishabhvyass
          filename: metrics/overview.svg
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          plugins_errors_fatal: no

      # ── 2 · Most used languages (replaces top-langs) ──
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: rishabhvyass
          filename: metrics/languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 10
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugins_errors_fatal: no

      # ── 3 · Isometric calendar + streak (replaces activity graph & streak) ──
      - name: Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: rishabhvyass
          filename: metrics/calendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugins_errors_fatal: no

      # ── 4 · Coding habits (bonus card) ──
      - name: Habits
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: rishabhvyass
          filename: metrics/habits.svg
          base: ""
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_charts: yes
          config_timezone: Asia/Kolkata
          plugins_errors_fatal: no

      # ── 5 · Achievements (replaces github-profile-trophy) ──
      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: rishabhvyass
          filename: metrics/achievements.svg
          base: ""
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact
          plugins_errors_fatal: no
